# Project Veto Gradle settings.
# Force UTF-8 file encoding for all JVMs (compilers, daemons, tests) — Windows defaults to GBK
# which breaks compileJava when source files contain non-ASCII characters or when the file
# system encoding is misread.
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.country=US -Duser.language=en
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
