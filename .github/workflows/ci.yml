name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --warning-mode fail

      - name: Run Null Safety Compile Gate
        run: >-
          ./gradlew
          :veto-core:compileJava
          :veto-core:compileTestJava
          :veto-protocol:compileJava
          :veto-protocol:compileTestJava
          :veto-terminal:compileJava
          :veto-terminal:compileTestJava
          --warning-mode fail

      - name: Run Tests
        run: ./gradlew test --warning-mode fail

      - name: Build Fat JAR
        run: ./gradlew veto-core:bootJar --warning-mode fail

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veto-jar
          path: veto-core/build/libs/*.jar
