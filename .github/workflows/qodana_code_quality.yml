name: Qodana
on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: 'Apply Qodana quick-fixes to the selected branch'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          upload-result: true
          cache-default-branch-only: true
          args: ${{ inputs.apply_fixes && '--apply-fixes' || '' }}
          push-fixes: ${{ inputs.apply_fixes && 'branch' || 'none' }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_251269344 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
