# 用户可见错误消息（简体中文）。键必须与 messages.properties 保持一致。
# MessageFormat 语法：'' 表示一个字面单引号，{0}/{1}/... 为位置参数。
# 技术词不翻译：tier 名（TOP/MID/LOW/LOCAL）、provider/model/credKey 等字段名、
# "Settings > Model tiers"、/modeltier、/credential、/login 等命令。

error.auth.credentialsRequired=必须提供用户名和密码
error.auth.passwordTooShort=密码长度至少为 8 个字符
error.auth.alreadySetup=保险库已完成初始化，请使用 /login 登录
error.auth.setupFailed=初始化失败：{0}
error.auth.invalidCredentials=用户名或密码不正确
error.auth.loginFailed=登录失败：{0}
error.auth.invalidSession=登录状态无效或已过期
error.auth.adminRequired=需要管理员权限
error.auth.createUserFailed=创建用户失败：{0}
error.auth.notLoggedIn=未登录
error.auth.notAuthenticated=未通过身份验证

error.pattern.missingFields=必须同时提供 name 和 tier
error.pattern.duplicate=模式 ''{0}'' 已存在

error.tier.nameRequired=必须提供 name
error.tier.profileMissingAfterCreate=创建后未找到该配置
