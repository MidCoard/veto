error.tier.incomplete=配置 ''{1}'' 中 tier {0} 的绑定不完整：provider、model 和 credKey 均为必填。请在 Settings > Model tiers 中设置（或执行 /modeltier set {1} {0} <field> <value>）。
error.tier.noActiveProfile=用户 ''{0}'' 没有启用中的模型层配置。请在 Settings > Model tiers 中创建并启用一个（或执行 /modeltier create <name>，然后 /modeltier use <name>）。
error.tier.unknownProvider=未知的 provider：{0}
error.tier.invalidTemperature=无效的温度值：{0}
error.tier.invalidMaxTokens=无效的最大输出 tokens 值：{0}

error.vault.credKeyMissing=保险库中不存在凭证 ''{0}''。请先通过 /credential set {0} 存储。
error.vault.missingFields=必须同时提供 title 和 value
error.vault.credentialNotFound=凭证不存在：{0}

error.session.notFound=会话不存在：{0}
