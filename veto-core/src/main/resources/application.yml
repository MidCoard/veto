# Project Veto — Core Engine Configuration
server:
  port: 8443
  error:
    # ResponseStatusException reasons are written for end users (e.g. "Profile 'default' has no
    # binding for tier TOP") - include them in the error body so the web client can show the real
    # cause instead of a bare "Bad Request".
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/veto
    username: veto
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

veto:
  bus:
    websocket:
      port: 9090
      path: /veto/bus
      heartbeat-interval-ms: 30000
      reconnect-delay-ms: 5000
      max-reconnect-attempts: 10
    grpc:
      port: 9091
      max-message-size: 4194304  # 4 MB

  veto-gateway:
    enabled: true
    llama-cpp:
      model-path: ${VETO_LLAMA_MODEL_PATH:./models/veto-slm.gguf}
      n-ctx: 2048
      n-gpu-layers: 0
      temperature: 0.1
      gbnf-grammar-path: ./grammars/veto-output.gbnf
    intercept-all-outbound: true
    redact-secrets: true
    enforce-structural-constraints: true

  # Model tiers: the single source of truth for an agent's model. Patterns and agents bind to a
  # tier name (TOP/MID/LOW/LOCAL); each user configures their own named profiles (provider + base
  # URL + model + credential-key + sampling defaults per tier) via /modeltier, and switches which
  # profile is active with /modeltier use <profile>. Switching the active profile swaps the concrete
  # model for every pattern and agent that user owns, at the next resolution. credential-key is a
  # vault SECURE_NOTE title (per-user); store the secret via /credential set <key>.

  # Group roles (Leader / Mate) bind to a model tier, never a concrete model. The concrete
  # provider + model + credential come from the user's active model-tier profile, so switching
  # profiles swaps every group role's model at once. Only the tier name and the role-specific
  # system-prompt base live here. credential-key is a vault SECURE_NOTE title; store it via
  # /credential set <key>.
  group:
    leader:
      tier: TOP
      # system-prompt-base: "You are a Leader agent. Decompose the task and arrange the execution DAG node by node."
    mate:
      tier: MID
      max_calls_per_episode: 50
      # system-prompt-base: "You are a Mate agent. Execute the assigned task."
      # Per-skillset overrides: a skillset entry may set either field; unset fields fall back to
      # the global mate.tier / mate.system-prompt-base above. A coding skillset can run on a
      # stronger tier with a coding-focused prompt while a research skillset runs cheaper.
      # skillsets:
      #   coder:
      #     tier: MID
      #     system-prompt-base: "You are a coding Mate. Implement the assigned task."
      #   researcher:
      #     tier: LOW
      #     system-prompt-base: "You are a research Mate. Gather and summarize."

  orchestrator:
    max-workers: 4
    worker-idle-timeout-ms: 60000
    circuit-breaker-threshold: 3
    circuit-breaker-reset-ms: 30000

  sandbox:
    allowed-capabilities:
      - read_safe_file
      - compile_cpp_target
      - list_directory
      - diff_text_files
      - search_in_files
    forbid-generic-shell: true
    temp-dir: ${VETO_TEMP_DIR:./work/sandbox}

  security:
    # Install-time deployer policy: FULL_ACCESS (no path is CRITICAL) | PROTECTED (deny-list) | SANDBOXED (scoped to root) | TENANT (multi-user workspace).
    # Runtime screening matrix: STRICT | BALANCED | BYPASS_ALL.
    deployer-policy: ${VETO_DEPLOYER_POLICY:FULL_ACCESS}
    screening-mode: STRICT
    # How accounts may be created:
    #   solo   - single-user: first /signup wins (ADMIN), then blocked.
    #   public - multi-user: anonymous self-signup (first ADMIN, rest USER).
    #   invite - multi-user: no anonymous signup; bootstrap admin provisions the rest via /user create.
    # TENANT deployer-policy requires public or invite. The first admin is always created in-app via
    # /signup (no plaintext credential in this file). Under non-FULL_ACCESS policies the agent is
    # blocked from reading application.yml/config/audit via the ProtectedSet.
    signup:
      mode: ${VETO_SIGNUP_MODE:invite}

  terminal:
    max-concurrent-connections: 16
    request-timeout-ms: 60000
    watch-poll-interval-ms: 200

  vault:
    vault-home: ${VETO_VAULT_HOME:~/.veto}

  memory:
    # Persist long-term memory across restarts. Backends: memory (in-process, lost on restart),
    # jpa (PostgreSQL via MemoryRepository), vector (in-process VectorIndex), pgvector (Postgres
    # + pgvector extension). Default jpa so the agent is not "totally new" each run; uses the
    # Postgres datasource above.
    store: ${VETO_MEMORY_STORE:jpa}
    # Hybrid embedder (see top.focess.veto.memory.embedder). Default: local HashEmbedder stub
    # (deterministic 64-dim hash; weak semantic recall but no dependency). Activate a
    # ProviderEmbedder by setting VETO_MEMORY_EMBEDDER_PROVIDER (openai|gemini) plus model,
    # dimension, and a vault credential-key holding the API key. When store=pgvector the
    # vector(N) column tracks the active embedder's dimension.
    # embedder:
    #   provider: openai
    #   model: text-embedding-3-small
    #   dimension: 1536
    #   base-url: https://api.openai.com   # optional; defaults per provider
    #   credential-key: openai-embeddings  # vault SECURE_NOTE title

  observability:
    audit-log-path: ./audit/
    log-rotation-days: 365
    encryption-enabled: true
    tamper-proof: true

  training:
    python-path: python
    training-dir: ./training
    model-output-dir: ./models
    base-model: Qwen/Qwen2.5-1.5B-Instruct
    default-gguf-name: veto-slm.gguf
    max-training-hours: 4
    auto-deploy-on-completion: true
    venv-path: ./training/.venv
    restart-bridge-on-deploy: true
    quality-filter-enabled: true
    custom-data-dir: ""

  mcp:
    server-registry-path: ./mcp/servers/
    discovery-interval-ms: 60000

logging:
  level:
    top.focess.veto: DEBUG
    org.springframework: WARN
