# Test configuration — overrides main application.yml for all tests
spring:
  datasource:
    url: jdbc:h2:mem:veto_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

veto:
  plugins:
    tool-names:
      "[top.focess.builtin:post_message]": post_message
      "[top.focess.builtin:remove_node]": remove_node
      "[top.focess.builtin:run_command]": run_command
      "[top.focess.builtin:run_task]": run_task
      "[top.focess.builtin:view_task]": view_task
      "[top.focess.builtin:input_task]": input_task
      "[top.focess.builtin:stop_task]": stop_task
      "[top.focess.builtin:load_skill]": load_skill
      "[top.focess.builtin:ask_user]": ask_user
      "[top.focess.builtin:read_github_repository]": read_github_repository
      "[top.focess.builtin:web_search]": web_search
      "[top.focess.builtin:web_fetch]": web_fetch
      "[top.focess.builtin:disband_group]": disband_group
      "[top.focess.builtin:inspect_group]": inspect_group
      "[top.focess.builtin:create_mate]": create_mate
      "[top.focess.builtin:create_task]": create_task
      "[top.focess.builtin:cancel_group_task]": cancel_group_task
      "[top.focess.builtin:remove_mate]": remove_mate
      "[top.focess.builtin:recall_memory]": recall_memory
      "[top.focess.builtin:write_memory]": write_memory
      "[top.focess.builtin:forget_memory]": forget_memory
      "[top.focess.builtin:create_monitor]": create_monitor
      "[top.focess.builtin:inspect_monitor]": inspect_monitor
      "[top.focess.builtin:pause_monitor]": pause_monitor
      "[top.focess.builtin:resume_monitor]": resume_monitor
      "[top.focess.builtin:cancel_monitor]": cancel_monitor
      "[top.focess.builtin:create_group]": create_group
      "[top.focess.builtin:submit_plan]": submit_plan
      "[top.focess.builtin:answer_with_citations]": answer_with_citations
      "[top.focess.builtin:view_file]": view_file
      "[top.focess.builtin:list_dir]": list_dir
      "[top.focess.builtin:find_files]": find_files
      "[top.focess.builtin:grep_search]": grep_search
      "[top.focess.builtin:write_to_file]": write_to_file
      "[top.focess.builtin:replace_file_content]": replace_file_content
      "[top.focess.builtin:move_path]": move_path
      "[top.focess.builtin:delete_path]": delete_path
  observability:
    audit-log-path: ${java.io.tmpdir}/veto-test-audit
  slm:
    enabled: false
  terminal:
    enabled: false
    bind-address: tcp://127.0.0.1:5555
  workspace:
    root: ""
    roots: ""
    path-mode: REAL
  breaker:
    max_calls_per_episode: 50
  context:
    max_input_tokens: 32000
    context_fill_ratio: 0.9
  skills:
    project-dir: ""
  webfetch:
    fetch:
      timeout-seconds: 30
      max-chars: 40000
      allow-private-addresses: false
    model-tier: LOW
    max-rounds: 12
    timeout-seconds: 120
    max-input-tokens: 32000
    max-output-tokens: 4096
  websearch:
    provider: duckduckgo
    brave:
      api-key: ""
  group:
    tick:
      interval-ms: 1000
    leader:
      tier: TOP
      system-prompt-base: ""
    mate:
      tier: MID
      max_calls_per_episode: 50
      system-prompt-base: ""
  security:
    deployer-policy: FULL_ACCESS
    screening-mode: STRICT
    signup:
      mode: solo
  vault:
    vault-home: ./build/tmp/veto-test
  test:
    deepseek:
      api-key: ""
      model: deepseek-v4-pro
